<!-- ==========================================================
     ADD ALERT MODAL
========================================================== -->

<div
    class="modal"
    id="addAlertModal">

    <div class="modal-content">

        <!-- ==========================================
             HEADER
        =========================================== -->

        <div class="modal-header">

            <div>

                <h2>

                    Create Expiry Alert

                </h2>

                <p>

                    Configure automatic expiry notifications.

                </p>

            </div>

            <button
                class="modal-close"
                id="closeAddAlertModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <!-- ==========================================
             FORM
        =========================================== -->

        <form
            action="{{ url_for('expiry.add_alert') }}"
            method="POST">

            <div class="modal-body">

                <!-- ======================================
                     ALERT INFORMATION
                ======================================= -->

                <h3 class="section-title">

                    Alert Information

                </h3>

                <div class="form-grid">

                    <!-- Alert Name -->

                    <div class="form-group">

                        <label>

                            Alert Name

                        </label>

                        <input
                            type="text"
                            name="alert_name"
                            placeholder="Expiry Alert"
                            required>

                    </div>

                    <!-- Medicine -->

                    <div class="form-group">

                        <label>

                            Medicine

                        </label>

                        <select
                            name="medicine_id"
                            required>

                            <option value="">

                                Select Medicine

                            </option>

                            {% for medicine in medicines %}

                            <option value="{{ medicine.id }}">

                                {{ medicine.medicine_name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Alert Before -->

                    <div class="form-group">

                        <label>

                            Alert Before

                        </label>

                        <select
                            name="days_before"
                            required>

                            <option value="7">

                                7 Days

                            </option>

                            <option value="15">

                                15 Days

                            </option>

                            <option value="30" selected>

                                30 Days

                            </option>

                            <option value="45">

                                45 Days

                            </option>

                            <option value="60">

                                60 Days

                            </option>

                            <option value="90">

                                90 Days

                            </option>

                        </select>

                    </div>

                    <!-- Priority -->

                    <div class="form-group">

                        <label>

                            Priority

                        </label>

                        <select
                            name="priority"
                            required>

                            <option value="High">

                                High

                            </option>

                            <option value="Medium">

                                Medium

                            </option>

                            <option value="Low">

                                Low

                            </option>

                        </select>

                    </div>

                                        <!-- Notification Method -->

                    <div class="form-group">

                        <label>

                            Notification Method

                        </label>

                        <select
                            name="notification_method"
                            required>

                            <option value="Dashboard">

                                Dashboard Notification

                            </option>

                            <option value="Email">

                                Email Notification

                            </option>

                            <option value="SMS">

                                SMS Notification

                            </option>

                            <option value="All">

                                Email + SMS + Dashboard

                            </option>

                        </select>

                    </div>

                    <!-- Repeat -->

                    <div class="form-group">

                        <label>

                            Reminder Frequency

                        </label>

                        <select
                            name="repeat_frequency"
                            required>

                            <option value="Daily">

                                Daily

                            </option>

                            <option value="Weekly">

                                Weekly

                            </option>

                            <option value="Once">

                                Once Only

                            </option>

                        </select>

                    </div>

                    <!-- Status -->

                    <div class="form-group">

                        <label>

                            Alert Status

                        </label>

                        <select
                            name="status">

                            <option value="Active" selected>

                                Active

                            </option>

                            <option value="Inactive">

                                Inactive

                            </option>

                        </select>

                    </div>

                    <!-- Notes -->

                    <div class="form-group full">

                        <label>

                            Notes

                        </label>

                        <textarea
                            name="notes"
                            rows="5"
                            placeholder="Enter any notes related to this alert..."></textarea>

                    </div>

                </div>

            </div>

            <!-- ======================================
                 FOOTER
            ======================================= -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelAddAlert">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="save-btn">

                    <i class="fa-solid fa-bell"></i>

                    Create Alert

                </button>

            </div>

        </form>

    </div>

</div>
