<!-- ==========================================================
     VIEW STOCK MODAL
========================================================== -->

<div
    class="modal"
    id="viewStockModal">

    <div class="modal-content">

        <!-- ==================================================
             HEADER
        =================================================== -->

        <div class="modal-header">

            <div>

                <h2>

                    Stock Details

                </h2>

                <p>

                    View complete medicine inventory information.

                </p>

            </div>

            <button
                class="modal-close"
                id="closeViewStockModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <!-- ==================================================
             BODY
        =================================================== -->

        <div class="modal-body">

            <!-- ==========================================
                 TOP SECTION
            =========================================== -->

            <div class="view-stock-header">

                <div class="view-stock-image">

                    <img
                        id="viewMedicineImage"
                        src="{{ url_for('static', filename='images/default-medicine.png') }}"
                        alt="Medicine">

                </div>

                <div class="view-stock-info">

                    <h2 id="viewMedicineName">

                        Paracetamol 500mg

                    </h2>

                    <p id="viewGenericName">

                        Generic Name

                    </p>

                    <span
                        class="status success"
                        id="viewStatus">

                        In Stock

                    </span>

                </div>

            </div>

            <!-- ==========================================
                 BASIC INFORMATION
            =========================================== -->

            <h3 class="section-title">

                Basic Information

            </h3>

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        Medicine Code

                    </label>

                    <input
                        type="text"
                        id="viewMedicineCode"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Barcode

                    </label>

                    <input
                        type="text"
                        id="viewBarcode"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Category

                    </label>

                    <input
                        type="text"
                        id="viewCategory"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Supplier

                    </label>

                    <input
                        type="text"
                        id="viewSupplier"
                        readonly>

                </div>

            </div>

                        <!-- ==========================================
                 STOCK INFORMATION
            =========================================== -->

            <h3 class="section-title">

                Stock Information

            </h3>

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        Manufacturer

                    </label>

                    <input
                        type="text"
                        id="viewManufacturer"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Batch Number

                    </label>

                    <input
                        type="text"
                        id="viewBatchNumber"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Purchase Price (₹)

                    </label>

                    <input
                        type="text"
                        id="viewPurchasePrice"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Selling Price (₹)

                    </label>

                    <input
                        type="text"
                        id="viewSellingPrice"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Current Stock

                    </label>

                    <input
                        type="text"
                        id="viewQuantity"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Reorder Level

                    </label>

                    <input
                        type="text"
                        id="viewReorderLevel"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Unit

                    </label>

                    <input
                        type="text"
                        id="viewUnit"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Inventory Value

                    </label>

                    <input
                        type="text"
                        id="viewInventoryValue"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Manufacture Date

                    </label>

                    <input
                        type="text"
                        id="viewManufactureDate"
                        readonly>

                </div>

                <div class="form-group">

                    <label>

                        Expiry Date

                    </label>

                    <input
                        type="text"
                        id="viewExpiryDate"
                        readonly>

                </div>

                <div class="form-group full">

                    <label>

                        Description

                    </label>

                    <textarea
                        id="viewDescription"
                        rows="5"
                        readonly></textarea>

                </div>

            </div>

        </div>

        <!-- ==========================================
             FOOTER
        =========================================== -->

        <div class="modal-footer">

            <button
                type="button"
                class="cancel-btn"
                id="closeViewStock">

                Close

            </button>

        </div>

    </div>

</div>
