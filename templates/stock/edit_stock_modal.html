<!-- ==========================================================
     EDIT STOCK MODAL
========================================================== -->

<div
    class="modal"
    id="editStockModal">

    <div class="modal-content">

        <!-- ==================================================
             HEADER
        =================================================== -->

        <div class="modal-header">

            <div>

                <h2>

                    Edit Stock

                </h2>

                <p>

                    Update medicine inventory information.

                </p>

            </div>

            <button
                class="modal-close"
                id="closeEditStockModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <!-- ==================================================
             FORM
        =================================================== -->

        <form
            id="editStockForm"
            method="POST"
            enctype="multipart/form-data">

            <input
                type="hidden"
                id="editStockId"
                name="id">

            <div class="modal-body">

                <!-- ==========================================
                     BASIC INFORMATION
                =========================================== -->

                <h3 class="section-title">

                    Basic Information

                </h3>

                <div class="form-grid">

                    <!-- Medicine Code -->

                    <div class="form-group">

                        <label>

                            Medicine Code

                        </label>

                        <input
                            type="text"
                            id="editMedicineCode"
                            name="medicine_code"
                            readonly>

                    </div>

                    <!-- Barcode -->

                    <div class="form-group">

                        <label>

                            Barcode

                        </label>

                        <input
                            type="text"
                            id="editBarcode"
                            name="barcode">

                    </div>

                    <!-- Medicine Name -->

                    <div class="form-group">

                        <label>

                            Medicine Name

                        </label>

                        <input
                            type="text"
                            id="editMedicineName"
                            name="medicine_name"
                            required>

                    </div>

                    <!-- Generic Name -->

                    <div class="form-group">

                        <label>

                            Generic Name

                        </label>

                        <input
                            type="text"
                            id="editGenericName"
                            name="generic_name">

                    </div>

                    <!-- Category -->

                    <div class="form-group">

                        <label>

                            Category

                        </label>

                        <select
                            id="editCategory"
                            name="category"
                            required>

                            {% for category in categories %}

                            <option value="{{ category[0] }}">

                                {{ category[0] }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Supplier -->

                    <div class="form-group">

                        <label>

                            Supplier

                        </label>

                        <input
                            type="text"
                            id="editSupplier"
                            name="supplier">

                    </div>

                </div>

                                <!-- ==========================================
                     STOCK INFORMATION
                =========================================== -->

                <h3 class="section-title">

                    Stock Information

                </h3>

                <div class="form-grid">

                    <!-- Manufacturer -->

                    <div class="form-group">

                        <label>

                            Manufacturer

                        </label>

                        <input
                            type="text"
                            id="editManufacturer"
                            name="manufacturer"
                            required>

                    </div>

                    <!-- Batch Number -->

                    <div class="form-group">

                        <label>

                            Batch Number

                        </label>

                        <input
                            type="text"
                            id="editBatchNumber"
                            name="batch_number"
                            required>

                    </div>

                    <!-- Purchase Price -->

                    <div class="form-group">

                        <label>

                            Purchase Price (₹)

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            id="editPurchasePrice"
                            name="purchase_price"
                            required>

                    </div>

                    <!-- Selling Price -->

                    <div class="form-group">

                        <label>

                            Selling Price (₹)

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            id="editSellingPrice"
                            name="selling_price"
                            required>

                    </div>

                    <!-- Quantity -->

                    <div class="form-group">

                        <label>

                            Quantity

                        </label>

                        <input
                            type="number"
                            min="0"
                            id="editQuantity"
                            name="quantity"
                            required>

                    </div>

                    <!-- Reorder Level -->

                    <div class="form-group">

                        <label>

                            Reorder Level

                        </label>

                        <input
                            type="number"
                            min="0"
                            id="editReorderLevel"
                            name="reorder_level"
                            required>

                    </div>

                    <!-- Unit -->

                    <div class="form-group">

                        <label>

                            Unit

                        </label>

                        <select
                            id="editUnit"
                            name="unit"
                            required>

                            <option value="Tablets">Tablets</option>

                            <option value="Capsules">Capsules</option>

                            <option value="Bottles">Bottles</option>

                            <option value="Strips">Strips</option>

                            <option value="Vials">Vials</option>

                            <option value="Boxes">Boxes</option>

                            <option value="Syrup">Syrup</option>

                            <option value="Injection">Injection</option>

                        </select>

                    </div>

                    <!-- Manufacture Date -->

                    <div class="form-group">

                        <label>

                            Manufacture Date

                        </label>

                        <input
                            type="date"
                            id="editManufactureDate"
                            name="manufacture_date">

                    </div>

                    <!-- Expiry Date -->

                    <div class="form-group">

                        <label>

                            Expiry Date

                        </label>

                        <input
                            type="date"
                            id="editExpiryDate"
                            name="expiry_date"
                            required>

                    </div>

                </div>

                                <!-- ==========================================
                     IMAGE & DESCRIPTION
                =========================================== -->

                <h3 class="section-title">

                    Additional Information

                </h3>

                <div class="form-grid">

                    <!-- Medicine Image -->

                    <div class="form-group">

                        <label>

                            Medicine Image

                        </label>

                        <input
                            type="file"
                            id="editStockImage"
                            name="image"
                            accept="image/*">

                    </div>

                    <!-- Current Image -->

                    <div class="form-group">

                        <label>

                            Current Image

                        </label>

                        <div class="image-preview">

                            <img
                                id="editStockPreview"
                                src="{{ url_for('static', filename='images/default-medicine.png') }}"
                                alt="Medicine Image">

                        </div>

                    </div>

                    <!-- Description -->

                    <div class="form-group full">

                        <label>

                            Description

                        </label>

                        <textarea
                            id="editDescription"
                            name="description"
                            rows="5"
                            placeholder="Enter medicine description..."></textarea>

                    </div>

                </div>

            </div>

            <!-- ==========================================
                 MODAL FOOTER
            =========================================== -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="cancel-btn"
                    id="cancelEditStock">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Stock

                </button>

            </div>

        </form>

    </div>

</div>
