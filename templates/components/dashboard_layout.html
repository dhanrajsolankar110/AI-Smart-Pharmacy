<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}

        AI Smart Pharmacy

        {% endblock %}

    </title>

    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Global Styles -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/variables.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/layout.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/sidebar.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/header.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/medicines.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/notifications.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/patients.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/expiry.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/prescriptions.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/reports.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/stock.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/settings.css') }}">

      <link rel="stylesheet"
          href="{{ url_for('static', filename='css/modal.css') }}">

    {% block extra_css %}

    {% endblock %}

</head>

<body>

    <div class="app-container">

        {% include "components/sidebar.html" %}

        <div class="content-wrapper">

            {% include "components/header.html" %}

            <main class="main-content">

                {% block content %}

                {% endblock %}

            </main>

        </div>

    </div>

    <!-- Global JS -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <script src="{{ url_for('static', filename='js/medicines.js') }}"></script>

    {% block extra_js %}

    {% endblock %}

</body>

</html>
